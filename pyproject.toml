[project]
name = "recomp-profiler"
version = "0.1.0"
description = "Remote debug/profile/control agent + MCP server for testing recomps on bare-metal Linux and Windows machines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "websockets>=13",
    "psutil>=5.9",
    "cryptography>=42",
    "textual>=1.0",
    "tomli>=2; python_version < \"3.11\"",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# Only needed on the dev machine that runs Claude Code.
mcp = ["mcp>=2.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
recomp-agent = "recomp_profiler.agent.__main__:main"
recomp-profiler = "recomp_profiler.cli:main"
recomp-profiler-mcp = "recomp_profiler.mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recomp_profiler"]

# Ship the install scripts so the TUI's System setup works from a plain pip install.
[tool.hatch.build.targets.wheel.force-include]
"scripts" = "recomp_profiler/scripts"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
